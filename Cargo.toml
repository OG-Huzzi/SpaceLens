[workspace]
resolver = "2"
members = ["crates/coresight-core", "crates/coresight-engine", "crates/coresight-classifier", "crates/coresight-identity", "crates/coresight-history", "crates/coresight-apps", "crates/coresight-capabilities", "crates/coresight-macos"]

# The Tauri shell crate (src-tauri) is a config-level contract and is NOT a
# workspace member until MSVC-based CI exists, because linking Tauri on
# Windows requires the MSVC toolchain (see progress/PHASE_0_STATUS.md —
# this machine has the GNU toolchain only). Phase 1 adds `coresight-engine`,
# the pure filesystem engine (no DB, no UI, no network dependencies).
# Phase 6.1 adds `coresight-capabilities` (shared, platform-neutral
# capability contracts: pillars, honest observation states, safety
# pipeline, permission model) and `coresight-macos` (the macOS discovery
# boundary: source catalog + permission-aware observation).
