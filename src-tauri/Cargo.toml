[package]
name = "coresight"
version = "0.0.0"
edition = "2021"
description = "CoreSight Tauri 2 desktop shell — window setup and the typed `coresight.v1.*` command table. Contains no business logic: every command forwards to `coresight-ipc::dispatch`."

# Deliberately its own workspace root. `src-tauri` sits under the repository
# root, so without this empty table Cargo would try to attach it to the root
# workspace (whose `members` list does not include it and must not be edited
# from here). Declaring `[workspace]` here keeps the shell, its dependency
# graph and its `Cargo.lock` separate from the engine workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
coresight-ipc = { path = "../crates/coresight-ipc" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
