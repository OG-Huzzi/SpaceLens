# CoreSight — UNSIGNED bundle builds.
#
# Deliberately a SEPARATE workflow from `ci.yml`, for two reasons:
#
#   1. Bundling needs OS-level toolchains that unit tests do not: MSVC C++
#      build tools + the Windows SDK on Windows, Xcode command line tools on
#      macOS, and the Tauri CLI downloads NSIS/WiX at build time. Those are
#      more fragile than `cargo test`, and a packaging failure must never be
#      able to turn the required `ci.yml` gate red, nor hide a test failure
#      behind a bundling failure.
#   2. A cold release build plus installer generation is slow, so it must not
#      run on every pull request. Triggers are `push` to `main` and manual
#      `workflow_dispatch` only.
#
# This job is NOT `continue-on-error`. It fails loudly when a bundle cannot be
# produced — a gate that cannot fail is not a gate. It is simply not a
# required check for merging; `ci.yml` remains the merge gate.
#
# NOTHING HERE IS SIGNED. There is no Apple Developer ID certificate and no
# Windows code-signing certificate in this repository (see
# docs/PACKAGING.md). Artifacts are therefore explicitly named `-unsigned` and
# carry an `UNSIGNED-BUILD.txt` note inside the artifact.
#
# macOS is built for `universal-apple-darwin` (arm64 + x86_64 in one artifact)
# and the job proves the executable has both slices with `lipo` before upload.

name: Bundle (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: bundle (${{ matrix.os }}) unsigned
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `--bundles` is validated per platform by the Tauri CLI: on Windows
          # only msi/nsis are accepted, on macOS only app/dmg. Listing foreign
          # formats here would fail, which is why each entry carries the exact
          # per-platform argument list instead of one shared value.
          #
          # macOS builds `universal-apple-darwin`: one `.app`/`.dmg` containing
          # both an arm64 and an x86_64 slice, so Apple-silicon and Intel Macs
          # are covered by the same artifact. `tauri build --help` (CLI 2.12.4)
          # documents the target: "It must be one of the values outputted by
          # `$rustc --print target-list` or `universal-apple-darwin` for an
          # universal macOS application", and both `aarch64-apple-darwin` and
          # `x86_64-apple-darwin` must be installed. The bundler writes to a
          # per-target directory: `target/<target>/release/bundle`.
          - os: windows-latest
            build_args: "--bundles nsis,msi"
            bundle_dir: src-tauri/target/release/bundle
            artifact: coresight-windows-x64-unsigned
          - os: macos-latest
            build_args: "--bundles app,dmg --target universal-apple-darwin"
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
            artifact: coresight-macos-universal-unsigned

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # `--target universal-apple-darwin` needs BOTH macOS standard libraries in
      # the same toolchain. `macos-latest` is Apple silicon, so arm64 is the
      # host target and x86_64 is the cross-compiled slice. Installing both
      # explicitly keeps the job correct even if the runner image architecture
      # changes. On Windows this step is skipped.
      - name: Add both macOS Rust targets (universal build only)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # The desktop shell is its own Cargo workspace root (src-tauri/Cargo.toml),
      # so the default cache scope (the root workspace) would miss its target/
      # directory entirely.
      - name: Cache the shell workspace target directory
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install JavaScript dependencies
        run: npm ci

      # `tauri build` runs `build.beforeBuildCommand` (`npm run build`) itself,
      # then compiles release and generates the platform installers.
      - name: Build unsigned bundle
        run: npm run tauri:build -- ${{ matrix.build_args }} --ci
        env:
          CI: "true"

      # Do not trust the flag: prove the artifact really is universal before it
      # is collected. `lipo` ships with the Xcode command line tools that the
      # macOS runner already has. A thin (arm64-only or x86_64-only) binary
      # fails the job here instead of being published as "universal".
      - name: Verify the macOS app has both architectures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          app="${{ matrix.bundle_dir }}/macos/CoreSight.app"
          binary="$app/Contents/MacOS/CoreSight"

          if [ ! -x "$binary" ]; then
            echo "::error title=Universal build produced no executable::$binary is missing or not executable, so the bundle cannot be verified as universal."
            exit 1
          fi

          archs="$(lipo -archs "$binary")"
          echo "lipo -archs $binary -> $archs"

          for want in arm64 x86_64; do
            case " $archs " in
              *" $want "*)
                echo "OK: $want slice present"
                ;;
              *)
                echo "::error title=macOS bundle is not universal::Expected both arm64 and x86_64 in the CoreSight executable, got '$archs'. Check that rustup target add ran and that --target universal-apple-darwin reached cargo."
                exit 1
                ;;
            esac
          done

      - name: Collect installers and write the unsigned notice
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          # `tauri build --target <triple>` writes to target/<triple>/release/
          # bundle, while a host build writes to target/release/bundle. The
          # matrix carries the exact directory for this runner.
          bundle_dir="${{ matrix.bundle_dir }}"

          if [ ! -d "$bundle_dir" ]; then
            echo "::error title=Tauri produced no bundle directory::$bundle_dir does not exist. The build step reported success but wrote no bundle output. Check that bundle.active is true, that bundle.targets is not empty, and that the --target value matches the directory. See docs/PACKAGING.md."
            exit 1
          fi

          # Copy every non-empty installer the bundler produced. `find` is used
          # instead of bash glob arrays because macOS runners still ship bash 3.2.
          find "$bundle_dir" -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -size +0c \
            -exec cp {} artifacts/ \;

          # A .app is a directory; upload-artifact does not preserve executable
          # bits, so zip it (ditto keeps the bundle structure and modes).
          if [ "${{ runner.os }}" = "macOS" ]; then
            for app in "$bundle_dir"/macos/*.app; do
              [ -d "$app" ] || continue
              ditto -c -k --keepParent "$app" "artifacts/$(basename "$app" .app)-unsigned.zip"
            done
          fi

          {
            echo "CoreSight — UNSIGNED build"
            echo "=========================="
            echo ""
            echo "Commit:   $(git rev-parse HEAD)"
            echo "Runner:   ${{ matrix.os }} ($(uname -srm))"
            echo "Built at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Run:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "This artifact is NOT code-signed and NOT notarised."
            echo "  macOS:   Gatekeeper blocks it until the user bypasses it."
            echo "  Windows: SmartScreen warns until the user chooses More info -> Run anyway."
            echo "No Apple Developer ID and no Windows code-signing certificate exist in this repository."
            echo "See docs/PACKAGING.md for exactly what is missing before this is distributable."
          } > artifacts/UNSIGNED-BUILD.txt

          echo "--- artifacts ---"
          ls -lh artifacts

          installers=$(find artifacts -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -size +0c \
            | wc -l | tr -d ' ')

          if [ "$installers" -eq 0 ]; then
            echo "::error title=No installer produced::The Tauri bundler exited successfully but wrote no installer for ${{ matrix.os }}. Expected $bundle_dir/nsis/*.exe or $bundle_dir/msi/*.msi on Windows, $bundle_dir/dmg/*.dmg on macOS. Check the 'Build unsigned bundle' log for the first error, then see docs/PACKAGING.md."
            exit 1
          fi

          echo "Collected $installers installer file(s)."
          echo "### Unsigned bundle: \`${{ matrix.artifact }}\` — $installers installer file(s)" >> "$GITHUB_STEP_SUMMARY"
          echo "This build is **unsigned** and **not notarised**." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      # Runs only when an earlier step failed; it does not change the job's
      # outcome, it just makes the failure diagnosable from the log alone.
      - name: Diagnose the failure
        if: failure()
        shell: bash
        run: |
          echo "::error title=Unsigned bundle failed::A step above failed. Bundling is CI-only: it needs MSVC C++ build tools + Windows SDK (Windows) or Xcode command line tools (macOS), and the Tauri CLI downloads NSIS/WiX on first use. Reproduce locally with: npm ci && npm run tauri:build. See docs/PACKAGING.md. A failure here does not affect the required CI gate in ci.yml."
