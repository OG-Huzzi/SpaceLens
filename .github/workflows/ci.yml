# SpaceLens CI — Phase 1.
#
# Verifies the Rust engine (spacelens-core + spacelens-engine) on all three
# target platforms and the frontend scaffold. Native Tauri compilation is
# intentionally NOT attempted yet: the shell crate is still a config-level
# contract and its bundle icons do not exist until the packaging work
# (see progress/PHASE_1_STATUS.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Tests (bounded parallelism, 8 GB-RAM-safe)
        run: cargo test -j 2 --workspace

      - name: Perf smoke (10k-file fixture; correctness asserted, timing reported)
        run: cargo test -j 2 -p spacelens-engine -- --ignored --nocapture

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (typecheck + vite)
        run: npm run build
