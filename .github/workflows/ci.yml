# CoreSight CI.
#
# Verifies the full Rust workspace and the frontend on the two platforms
# CoreSight actually ships to: Windows and macOS. Linux is deliberately NOT a
# gate — it is not a shipping target, so a Linux job would spend runner minutes
# proving portability nobody consumes. Both platform families are still
# covered: macOS exercises the unix `cfg` paths, Windows exercises the win32
# ones, so no conditional-compilation branch goes untested.
# `--workspace` is what keeps new crates in the gate automatically: adding a
# workspace member adds it to every Rust job here with no CI edit.
# Native Tauri compilation is intentionally NOT attempted yet: the shell
# crate is still a config-level contract and its bundle icons do not exist
# until the packaging work (see progress/PHASE_0_STATUS.md).
#
# Every Rust job runs the full quality gate: `cargo fmt --check`,
# `cargo clippy -D warnings`, and `cargo test`. Clippy is part of the gate on
# every platform — lint findings are OS-sensitive enough (and platform `cfg`
# bugs silent enough) that a single-host lint job would not be equivalent.
# Parallelism is capped at `-j 2` so the jobs stay inside an 8 GB runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy (bounded parallelism, 8 GB-RAM-safe; warnings are errors)
        run: cargo clippy -j 2 --workspace --all-targets -- -D warnings

      - name: Tests (bounded parallelism, 8 GB-RAM-safe)
        run: cargo test -j 2 --workspace

      - name: Phase 1 perf smoke (correctness asserted, timing reported)
        run: cargo test -j 2 -p coresight-engine -- --ignored --nocapture

      - name: Phase 2 perf smoke (10k/100k/1M synthetic; linear-scaling guard)
        run: cargo test -j 2 -p coresight-classifier -- --ignored --nocapture

      - name: Phase 3+4 perf smoke (identity pipeline + relationship engine; hostile workloads, linear-scaling guard)
        run: cargo test -j 2 -p coresight-identity -- --ignored --nocapture --skip huge_file_streams_beyond_4gib

      - name: Phase 5 perf smoke (history comparison scaling; O(n+m) guard)
        run: cargo test -j 2 -p coresight-history -- --ignored --nocapture --test-threads=1

      - name: Phase 3 >4 GiB streaming proof (release mode, real-speed SHA-256 over 10 GiB virtual content)
        run: cargo test -j 2 -p coresight-identity --release --test perf_tests huge_file_streams_beyond_4gib -- --ignored --nocapture

      # The desktop shell is its own workspace root (src-tauri/Cargo.toml), so
      # `--workspace` above does not reach it. Type-check it explicitly or it
      # rots silently. This checks only — it does not link or bundle, which
      # needs the full Tauri packaging toolchain.
      - name: Desktop shell type-check (Tauri 2, not linked)
        if: runner.os == 'Windows'
        run: cargo check --manifest-path src-tauri/Cargo.toml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (typecheck + vite)
        run: npm run build
