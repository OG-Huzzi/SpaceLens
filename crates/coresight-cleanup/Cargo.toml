[package]
name = "coresight-cleanup"
version = "0.0.0"
edition = "2021"
description = "CoreSight cleanup planning and safety validation — pure planning layer for reversible, preview-first cleanup. No filesystem mutation, no trash adapter, no execution in this crate."
license = "UNLICENSED"

[lib]
name = "coresight_cleanup"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
coresight-classifier = { path = "../coresight-classifier" }
coresight-insights = { path = "../coresight-insights" }
coresight-capabilities = { path = "../coresight-capabilities" }
# `resolve` reads a `Snapshot` as plain data; it performs no history-store or
# filesystem I/O. The dependency is on the pure model types only.
coresight-history = { path = "../coresight-history" }

[dev-dependencies]
serde_json = "1"
coresight-engine = { path = "../coresight-engine" }
