[package]
name = "coresight-identity"
version = "0.0.0"
edition = "2021"
description = "CoreSight identity engine — Phase 3 (content identity, hashing, exact duplicate relationships)"
license = "UNLICENSED"

[lib]
name = "coresight_identity"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
coresight-engine = { path = "../coresight-engine" }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
