[package]
name = "coresight-collect"
version = "0.0.0"
edition = "2021"
description = "CoreSight inventory parsing — turns raw, caller-supplied system facts into the typed inventories the IPC layer serves (startup items, DNS candidates, block-list rules, privacy findings). Pure parsing: no filesystem access, no process execution, no network."
license = "UNLICENSED"

[lib]
name = "coresight_collect"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
coresight-systools = { path = "../coresight-systools" }
coresight-webtools = { path = "../coresight-webtools" }

[dev-dependencies]
serde_json = "1"
