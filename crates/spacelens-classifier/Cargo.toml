[package]
name = "spacelens-classifier"
version = "0.0.0"
edition = "2021"
description = "SpaceLens classification engine — Phase 2 (deterministic, offline, explainable)"
license = "UNLICENSED"

[lib]
name = "spacelens_classifier"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
spacelens-engine = { path = "../spacelens-engine" }

[dev-dependencies]
serde_json = "1"