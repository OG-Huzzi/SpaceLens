[package]
name = "coresight-actions"
version = "0.0.0"
edition = "2021"
description = "CoreSight action execution — the ONLY crate that moves files. Performs reversible Trash/quarantine moves with failure-safe rollback and an explicit authorization token. No permanent deletion, no secure wipe, no registry access, no network."
license = "UNLICENSED"

[lib]
name = "coresight_actions"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
coresight-cleanup = { path = "../coresight-cleanup" }
coresight-capabilities = { path = "../coresight-capabilities" }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
# Integration tests build a real `Snapshot` and resolve it through
# `coresight_cleanup::resolve_plan`, so the membership gate is exercised
# end-to-end rather than against a hand-built resolved plan.
coresight-history = { path = "../coresight-history" }
