[package]
name = "spacelens-engine"
version = "0.0.0"
edition = "2021"
description = "SpaceLens filesystem engine — Phase 1 (scanner, platform abstraction, progress/cancel)"
license = "UNLICENSED"

[lib]
name = "spacelens_engine"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
