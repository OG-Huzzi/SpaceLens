[package]
name = "coresight-macos"
version = "0.0.0"
edition = "2021"
description = "CoreSight macOS discovery boundary — Phase 6.1 (source catalog, permission-aware observation)"
license = "UNLICENSED"

[lib]
name = "coresight_macos"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
coresight-capabilities = { path = "../coresight-capabilities" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
