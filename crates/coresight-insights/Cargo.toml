[package]
name = "coresight-insights"
version = "0.0.0"
edition = "2021"
description = "CoreSight storage insights — read-only aggregation of a scan snapshot into the human answers the UI presents (per-category usage, what changed since the previous run, biggest historical movers). Pure over coresight-history and coresight-classifier types; performs no I/O, no filesystem access, no network, no persistence."
license = "UNLICENSED"

[lib]
name = "coresight_insights"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
coresight-classifier = { path = "../coresight-classifier" }
coresight-history = { path = "../coresight-history" }

[dev-dependencies]
serde_json = "1"
coresight-engine = { path = "../coresight-engine" }
