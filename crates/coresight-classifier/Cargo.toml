[package]
name = "coresight-classifier"
version = "0.0.0"
edition = "2021"
description = "CoreSight classification engine — Phase 2 (deterministic, offline, explainable)"
license = "UNLICENSED"

[lib]
name = "coresight_classifier"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
coresight-engine = { path = "../coresight-engine" }

[dev-dependencies]
serde_json = "1"