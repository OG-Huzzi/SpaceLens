[package]
name = "coresight-webtools"
version = "0.0.0"
edition = "2021"
description = "CoreSight web and privacy tools — pure models for domain block-list planning, DNS candidate ranking, and privacy (cookie/tracking) findings. Produces plans and evidence only; never writes the hosts file, never changes DNS, never touches the network."
license = "UNLICENSED"

[lib]
name = "coresight_webtools"
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
